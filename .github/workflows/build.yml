name: Build NX30 Pro 112M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget dwarves llvm python3-pyelftools \
            libpython3-dev libelf-dev device-tree-compiler

      - name: Clone source
        run: |
          git clone --depth 1 -b openwrt-24.10 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Apply 112M patch and feeds
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        working-directory: openwrt
        run: |
          cp ../seed.config .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nx30pro-112m-firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.itb
            openwrt/bin/targets/mediatek/filogic/*recovery.itb
          if-no-files-found: error
